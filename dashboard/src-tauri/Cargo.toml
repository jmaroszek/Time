[package]
name = "dashboard"
version = "0.1.0"
description = "Time tracking dashboard"
authors = ["Jonah Maroszek"]
edition = "2021"

[[bin]]
name = "Time"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.4.1"

[profile.dev]
# Full debug info is what makes a debug build enormous, and most of it is never
# read: a panic needs a file and a line, which line tables carry. Stepping
# through this crate in a native debugger — inspecting locals and types — is
# what this gives up, so raise it back to `true` for a session that needs one.
debug = "line-tables-only"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
