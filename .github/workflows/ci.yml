name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracker:
    # windows-latest because the tracker depends on pywin32.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r tracker/requirements-dev.txt
      - name: Run pytest with branch coverage
        run: |
          New-Item -ItemType Directory -Force coverage/python | Out-Null
          python -m coverage run -m pytest tracker/tests scripts/tests --junitxml=coverage/python/pytest.xml
          python -m coverage xml
          python -m coverage json
          python -m coverage report
      - name: Upload Python test and coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-quality-results
          path: coverage/python
          if-no-files-found: error

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run behavior suite and collect branch coverage
        run: npm run test:coverage
      # Date logic must agree in zones with different DST boundaries. Keep the
      # second run in this job: another matrix runner duplicated installation,
      # artifacts, and failure labels for a suite that takes only seconds.
      - name: Run behavior suite in a southern-hemisphere timezone
        env:
          TZ: Australia/Adelaide
        run: npm test
      - name: Check patch whitespace
        run: git diff --check
      - name: Upload dashboard coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-coverage
          path: dashboard/coverage/vitest
          if-no-files-found: error

  renderer-compatibility:
    name: renderer compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run device renderer suite
        run: npm run test:device
      - name: Upload renderer failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderer-compatibility-artifacts
          path: |
            dashboard/playwright-report
            dashboard/test-results/device
          if-no-files-found: ignore

  windows-backend:
    name: Windows backend
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tracker/requirements-build.txt
      # Pinned rather than `stable` so the formatting check is reproducible:
      # rustfmt's output changes between releases, so a floating stable makes
      # CI reject code that was correctly formatted against an older toolchain.
      # Keep in step with rust-toolchain.toml at the repository root.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard/src-tauri
      - name: Install dependencies
        run: npm ci
      # Every cargo invocation runs the Tauri build script, which requires the
      # externalBin sidecar on disk, so build it before any Rust step.
      - name: Install tracker build dependencies
        run: pip install -r tracker/requirements-build.txt
        working-directory: .
      - name: Build tracker sidecar
        run: python scripts/build_tracker.py
        working-directory: .
      - name: Smoke packaged tracker in scratch LOCALAPPDATA
        shell: pwsh
        run: |
          $tracker = Resolve-Path "src-tauri/binaries/time-tracker-x86_64-pc-windows-msvc.exe"
          $output = Join-Path $env:RUNNER_TEMP "time-packaged-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ../scripts/smoke_packaged_tracker.ps1 -TrackerExecutable $tracker -OutputDirectory $output
      - name: Upload packaged tracker smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-tracker-smoke
          path: ${{ runner.temp }}/time-packaged-smoke-${{ github.run_id }}-${{ github.run_attempt }}/results
          if-no-files-found: error
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # The only job that links the whole application. cargo test compiles the
      # crate but never produces the binary the installer ships.
      - name: Build debug application
        run: npm run build:debug-app
      # Last, and unconditional. This ran first once, and a formatting nit
      # aborted the job before a single test executed, so a run that should
      # have reported "one misplaced line break" reported nothing at all.
      # Formatting is independent of the tests, so it has no business
      # standing in front of them.
      - name: Check Rust formatting
        if: always()
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  protocol-parity:
    name: Shared protocol parity
    # Time and the browser extension parse one marker grammar from separate
    # repositories, and each keeps its own copy of the conformance fixture. A
    # check inside one repository can only prove self-consistency, so the two
    # copies must be compared against each other.
    #
    # Inert until EXTENSION_REPOSITORY is set to the extension's "owner/repo".
    # That repository has no remote yet, so CI cannot fetch it; until then the
    # comparison runs locally through tracker/tests/test_protocol_parity.py and
    # is a hard gate in the extension's own `npm run verify:release`. A private
    # extension repository additionally needs a PAT in EXTENSION_REPO_TOKEN.
    if: vars.EXTENSION_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check out the extension repository
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.EXTENSION_REPOSITORY }}
          token: ${{ secrets.EXTENSION_REPO_TOKEN || github.token }}
          path: extension-checkout
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pytest
        run: pip install pytest
      - name: Compare the shared protocol fixture
        env:
          TIME_EXTENSION_REPO: ${{ github.workspace }}/extension-checkout
          # Refuse to skip: pytest exits 0 on a skip, so without this a broken
          # checkout would report a green gate that compared nothing.
          TIME_PARITY_REQUIRED: "1"
        run: python -m pytest tracker/tests/test_protocol_parity.py -q

  quality-gate:
    name: Required quality gate
    if: always()
    needs:
      - tracker
      - dashboard
      - renderer-compatibility
      - windows-backend
      - protocol-parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every production quality job
        env:
          TRACKER_RESULT: ${{ needs.tracker.result }}
          DASHBOARD_RESULT: ${{ needs.dashboard.result }}
          RENDERER_RESULT: ${{ needs.renderer-compatibility.result }}
          WINDOWS_RESULT: ${{ needs.windows-backend.result }}
          PARITY_RESULT: ${{ needs.protocol-parity.result }}
        run: |
          test "$TRACKER_RESULT" = success
          test "$DASHBOARD_RESULT" = success
          test "$RENDERER_RESULT" = success
          test "$WINDOWS_RESULT" = success
          # "skipped" while EXTENSION_REPOSITORY is unset; must pass once it is.
          case "$PARITY_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
