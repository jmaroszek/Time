name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracker:
    # windows-latest because the tracker depends on pywin32.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r tracker/requirements-dev.txt
      - name: Run pytest with branch coverage
        run: |
          New-Item -ItemType Directory -Force coverage/python | Out-Null
          python -m coverage run -m pytest tracker/tests scripts/tests --junitxml=coverage/python/pytest.xml
          python -m coverage xml
          python -m coverage json
          python -m coverage report
      - name: Upload Python test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-quality-results
          path: coverage/python
          if-no-files-found: error

  dashboard:
    name: dashboard (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        timezone:
          - America/New_York
          - Australia/Adelaide
    env:
      TZ: ${{ matrix.timezone }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      # The native-test toolchain currently has upstream-only advisories, but
      # nothing bundled into Time may carry a known npm vulnerability.
      - name: Audit production dependencies
        if: matrix.timezone == 'America/New_York'
        run: npm audit --omit=dev
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run vitest with branch coverage
        run: npm run test:coverage
      - name: Check patch whitespace
        run: git diff --check
      - name: Upload dashboard coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-coverage-${{ strategy.job-index }}
          path: dashboard/coverage/vitest
          if-no-files-found: error

  renderer-compatibility:
    name: renderer compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run device renderer suite
        run: npm run test:device
      - name: Repeat deterministic renderer suite
        run: npm run test:device
      - name: Upload renderer failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-compatibility-artifacts
          path: |
            dashboard/playwright-report
            dashboard/test-results/device
          if-no-files-found: ignore

  # The WebDriver suite (npm run test:native) cannot run here: WebView2 never
  # opens a remote debugging port on a hosted runner, so no session can be
  # created. It runs from the release checklist on a real desktop instead.
  windows-backend:
    name: Windows backend
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tracker/requirements-build.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard/src-tauri
      - name: Install dependencies
        run: npm ci
      # Every cargo invocation runs the Tauri build script, which requires the
      # externalBin sidecar on disk, so build it before any Rust step.
      - name: Install tracker build dependencies
        run: pip install -r tracker/requirements-build.txt
        working-directory: .
      - name: Build tracker sidecar
        run: python scripts/build_tracker.py
        working-directory: .
      - name: Smoke packaged tracker in scratch LOCALAPPDATA
        shell: pwsh
        run: |
          $tracker = Resolve-Path "src-tauri/binaries/time-tracker-x86_64-pc-windows-msvc.exe"
          $output = Join-Path $env:RUNNER_TEMP "time-packaged-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ../scripts/smoke_packaged_tracker.ps1 -TrackerExecutable $tracker -OutputDirectory $output
      - name: Upload packaged tracker smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-tracker-smoke
          path: ${{ runner.temp }}/time-packaged-smoke-${{ github.run_id }}-${{ github.run_attempt }}/results
          if-no-files-found: error
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # Compiling the isolated debug application keeps the configuration the
      # local WebDriver suite depends on from rotting between releases.
      - name: Build isolated debug application
        run: npm run build:native-device

  quality-gate:
    name: Required quality gate
    if: always()
    needs:
      - tracker
      - dashboard
      - renderer-compatibility
      - windows-backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every production quality job
        env:
          TRACKER_RESULT: ${{ needs.tracker.result }}
          DASHBOARD_RESULT: ${{ needs.dashboard.result }}
          RENDERER_RESULT: ${{ needs.renderer-compatibility.result }}
          WINDOWS_RESULT: ${{ needs.windows-backend.result }}
        run: |
          test "$TRACKER_RESULT" = success
          test "$DASHBOARD_RESULT" = success
          test "$RENDERER_RESULT" = success
          test "$WINDOWS_RESULT" = success
