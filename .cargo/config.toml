# Repository root, not src-tauri/: Cargo discovers this file by walking up from
# the working directory, not from the manifest. CI runs
# `cargo test --manifest-path src-tauri/Cargo.toml` from dashboard/, so a config
# beside the crate is never read and the suite went back to running in parallel.
[env]
# The restore tests close a database and immediately rename or delete the file
# that connection owned. Windows releases the handle a moment after the close
# future resolves, and a parallel harness stretches that moment into a sharing
# violation — the suite failed roughly two runs in three on a developer machine.
# The whole lib suite runs in well under a second, so serializing it costs
# nothing and is the only setting that makes it deterministic.
RUST_TEST_THREADS = "1"

[build]
# Cargo never reclaims an incremental cache. Each one is about a gigabyte, and
# a new one is minted for every compilation-unit hash — a dependency bump, a
# feature or profile change, a toolchain change, or simply alternating between
# `cargo test` and `build:debug-app`, which are separate units with separate
# caches. The old directory is then dead and stays on disk forever: eighty-eight
# of them had reached 15.9 GB, against two that were live.
#
# Measured on this crate: an edit-and-rebuild costs 5s with the cache and 10s
# without. Five seconds on the rare day this crate is edited is the whole price,
# and the crate is small enough that it stays five seconds — revisit this if it
# grows, because the gap widens with the amount of code being recompiled.
incremental = false
